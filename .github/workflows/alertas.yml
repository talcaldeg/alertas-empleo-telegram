name: Alertas de empleo a Telegram

# Corre en la nube de GitHub, sin depender del PC.
# Horario: cada 2h durante el dia en Chile. GitHub usa UTC y Chile es UTC-4,
# asi que 08:00-22:00 Chile = 12:00-02:00 UTC (horas 12,14,16,18,20,22,0,2).
# El cron viene comentado a proposito: este repo es la version publicable, y sin
# TELEGRAM_BOT_TOKEN cargado en Settings > Secrets cada corrida fallaria sola cada
# 2 horas. Para usarlo de verdad: cargue los dos secrets y descomente el schedule.
on:
  # schedule:
  #   - cron: "0 0,2,12,14,16,18,20,22 * * *"
  workflow_dispatch: {}   # boton para correrlo a mano desde la pestana "Actions"

# Permiso para commitear seen_jobs.json de vuelta (memoria de lo ya enviado).
permissions:
  contents: write

# Evita que dos corridas se pisen si una se atrasa.
concurrency:
  group: alertas-empleo
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Corta la corrida si la regla de pago dejo de cumplirse. Sin red: casos sinteticos.
      - name: Verificar la regla de pago
        run: python alertas_empleos.py --autotest

      - name: Ejecutar alertas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alertas_empleos.py

      - name: Guardar ofertas ya enviadas (seen_jobs.json)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          git diff --staged --quiet || git commit -m "Actualizar seen_jobs.json [skip ci]"
          git push
